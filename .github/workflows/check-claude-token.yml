name: Check Claude token

# A quick check that the CLAUDE_CODE_OAUTH_TOKEN secret works.
# It touches no email or personal data, so its output is safe to show.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/check-claude-token.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Ask Claude to say OK
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "Token length after removing spaces and line breaks: ${#token}"
          CLAUDE_CODE_OAUTH_TOKEN="$token" ~/.local/bin/claude -p "Reply with the single word OK." \
            --model sonnet --max-turns 1 --output-format json | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          print('is_error:', r.get('is_error'))
          print('result:', str(r.get('result'))[:300])
          sys.exit(1 if r.get('is_error') else 0)"
