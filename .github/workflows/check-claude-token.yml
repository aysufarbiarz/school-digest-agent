name: Check Claude token

# A quick check that the CLAUDE_CODE_OAUTH_TOKEN secret works.
# It touches no email or personal data, so its output is safe to show.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/check-claude-token.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Ask Claude to say OK
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "Token length: ${#CLAUDE_CODE_OAUTH_TOKEN} characters"
          case "$CLAUDE_CODE_OAUTH_TOKEN" in
            sk-ant-oat*) echo "Token prefix looks right." ;;
            *) echo "Token does not start with sk-ant-oat." ;;
          esac
          if printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | grep -q '[[:space:]]'; then
            echo "Token contains spaces or line breaks."
          fi
          ~/.local/bin/claude -p "Reply with the single word OK." --model sonnet --max-turns 1 --output-format json
